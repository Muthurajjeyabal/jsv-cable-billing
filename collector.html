<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>JSV Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- LOGIN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-emerald-900">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-white text-2xl font-bold">₹</div>
        <h1 class="text-xl font-bold">JSV Collection</h1>
        <p class="text-sm text-slate-500">Agent App • S. Alangulam</p>
      </div>
      <div id="loginError" class="hidden mb-3 p-2 bg-red-50 text-red-600 text-sm rounded-lg"></div>
      <form id="loginForm" class="space-y-3">
        <input type="email" id="loginEmail" required placeholder="Email"
          class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
        <input type="password" id="loginPassword" required placeholder="Password"
          class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
        <button type="submit" id="loginBtn"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl">Login</button>
      </form>
    </div>
  </div>

  <!-- MAIN -->
  <div id="appScreen" class="hidden min-h-screen flex flex-col">
    <!-- Top bar -->
    <header class="bg-emerald-700 text-white px-4 py-3 sticky top-0 z-20 shadow">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-semibold">JSV Collection</div>
          <div class="text-xs opacity-80" id="agentName">Agent</div>
        </div>
        <div class="text-right">
          <div class="text-xs opacity-80">Today</div>
          <div class="font-bold" id="todayTotal">₹0</div>
        </div>
      </div>
    </header>

    <!-- Search -->
    <div class="p-3 bg-white border-b sticky top-[60px] z-10">
      <input type="text" id="searchInput" placeholder="Name / Mobile / Box / ID தேடுங்கள்..."
        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-base"
        oninput="doSearch()">
    </div>

    <!-- Results -->
    <div id="results" class="flex-1 overflow-y-auto p-3 space-y-2">
      <div class="text-center text-slate-400 py-10 text-sm">Customer தேடவும்</div>
    </div>

    <!-- Logout -->
    <div class="p-3 bg-white border-t">
      <button onclick="logout()" class="w-full py-2 text-red-600 text-sm font-medium">Logout</button>
    </div>
  </div>

  <!-- COLLECT MODAL -->
  <div id="collectModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="font-bold text-lg" id="modalName">-</h3>
          <p class="text-sm text-slate-500" id="modalInfo">-</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 text-2xl leading-none">&times;</button>
      </div>

      <div class="bg-red-50 rounded-xl p-3 mb-4 flex justify-between items-center">
        <span class="text-sm text-red-700">Due Amount</span>
        <span class="text-xl font-bold text-red-600" id="modalDue">₹0</span>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium mb-1">Collection Amount *</label>
          <input type="number" id="colAmount" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-lg font-semibold" inputmode="numeric">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Payment Mode</label>
          <select id="colMode" class="w-full px-4 py-3 border rounded-xl outline-none">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Bank">Bank</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Remarks</label>
          <input type="text" id="colRemarks" class="w-full px-4 py-3 border rounded-xl outline-none" placeholder="Optional">
        </div>
        <button onclick="saveCollection()" id="saveColBtn"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl text-lg">
          Save Collection
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-full text-white text-sm z-50 shadow-lg"></div>

  <script src="collector.js"></script>
</body>
</html>
